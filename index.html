<style>
:root{
  color-scheme:light;
  --page:#f8f6f1;--surface:#fffefa;--ink:#292c26;--muted:#6c716b;
  --line:#e5e1d7;--accent:#9d543a;--accent-soft:#f5eae3;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-synthesis:none;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);min-width:280px}
button,input,textarea{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(100% - 48px,1260px);margin-inline:auto}
.content-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.content-layout.single-column{grid-template-columns:minmax(0,1fr)}
.content-layout.single-column>.panel{max-width:880px}
.notes-sidebar{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 24px);overflow-y:auto;padding:10px 2px 20px;scrollbar-width:thin}
.notes-sidebar .study-notes{margin:12px 0}
.notes-sidebar .study-notes h3{font-size:16px}
.notes-sidebar textarea{font-size:14px;min-height:112px}
.notes-sidebar .expression-entry textarea{min-height:70px}
.notes-sidebar .notes-help{font-size:11px}
header{background:var(--page);border-bottom:1px solid var(--line)}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:19px;font-weight:800;letter-spacing:1.8px;white-space:nowrap;display:flex;align-items:center;gap:11px}
.brand-mark{width:36px;height:36px;border-radius:9px;flex:none;display:block}
.hero{position:relative}
.hero:after{content:"";position:absolute;right:3%;top:22px;width:108px;height:65px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2225%22%20fill%3D%22%23102638%22%2F%3E%3Cpath%20d%3D%22M16%20116h96l-16-12H32z%22%20fill%3D%22%23f4dfb2%22%2F%3E%3Cpath%20d%3D%22M46%20105%2052%2048h24l6%2057z%22%20fill%3D%22%23f4dfb2%22%2F%3E%3Cpath%20d%3D%22M58%2082h12v23H58zM61%2060h6v11h-6z%22%20fill%3D%22%23102638%22%2F%3E%3Cpath%20d%3D%22M46%2047h36v6H46zM51%2040h26l-5-8H56zM59%2031V19h10v12zM56%2018h16l-8-9z%22%20fill%3D%22%23f4dfb2%22%2F%3E%3Cpath%20d%3D%22M82%2033%20121%2018v32L82%2043z%22%20fill%3D%22%23f5dca7%22%2F%3E%3Cpath%20d%3D%22M48%2039h32v5H48z%22%20fill%3D%22%23f4dfb2%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;opacity:.12;pointer-events:none}
@media(max-width:650px){.brand-mark{width:30px;height:30px}.brand{gap:8px}.hero:after{width:65px;height:48px;right:0;top:12px;opacity:.09}}
.brand b{color:var(--accent)}
.nav{display:flex;align-items:center;gap:5px}
.nav button{
  background:transparent;border:0;border-radius:9px;color:var(--muted);
  padding:11px 15px;font-size:14px;font-weight:550;min-height:42px;
}
.nav button.active{color:var(--ink);background:#eae6dc;font-weight:700}
.nav button:hover{background:#eeebe3}
.hero{padding:28px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.9px;text-transform:uppercase;color:var(--accent)}
.hero h1{font:normal clamp(32px,5vw,47px)/1.12 Georgia,"Times New Roman",serif;letter-spacing:-.8px;margin:11px 0 8px}
.hero .sub{font-size:14px;color:var(--muted);margin:0}
.meta{font-size:11px;color:#87877d;margin-top:12px}
.panel{padding:22px 0 48px}
.panel[hidden],.notice[hidden]{display:none}
.head{margin:0 0 16px}
.head h2{font-size:19px;font-weight:700;margin:6px 0}
.head .eyebrow{display:none}
.muted{color:var(--muted);font-size:12px;line-height:1.6}
.box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:27px;margin:12px 0;
}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.snippet-title{font:normal clamp(23px,3vw,29px)/1.24 Georgia,"Times New Roman",serif;margin:16px 0 21px;color:var(--ink)}
.passage-wrap{max-width:100%}
.passage-text{font:normal clamp(19px,2.4vw,22px)/2.0 Georgia,"Times New Roman",serif;letter-spacing:.05px;margin:0 0 18px;overflow-wrap:break-word}
.answer-group{
  display:inline-flex;align-items:center;flex-wrap:wrap;vertical-align:middle;
  gap:5px;max-width:100%;margin:5px 3px;
}
.blank-tag{font:700 11px/1.3 system-ui,sans-serif;color:var(--accent);align-self:flex-start}
.single-word-slot{
  width:118px;max-width:40vw;min-height:40px;line-height:1.2;
  border:1px solid #d6cec0;border-bottom:2px solid var(--accent);
  border-radius:6px 6px 2px 2px;background:#f8f5ef;
  color:var(--ink);text-align:center;padding:6px 8px;
  font:normal 17px Georgia,"Times New Roman",serif;
}
.single-word-slot:focus{background:white;border-color:var(--accent)}
.gap-action{
  border:1px solid var(--line);border-radius:7px;
  background:transparent;color:#66665e;min-height:38px;min-width:44px;
  padding:5px 9px;font-size:12px;font-weight:650;line-height:1.15;
}
.gap-action:hover{opacity:.82}
@keyframes briefHintShake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-5px)}
  40%,80%{transform:translateX(5px)}
}
.gap-hint.hint-at-limit{animation:briefHintShake .38s ease-in-out}
.hint-limit-message{color:var(--accent);font-size:12px;font-weight:600;line-height:1.6}
.hint-limit-message:empty{display:none}
@media(prefers-reduced-motion:reduce){
 .gap-hint.hint-at-limit{animation:none;outline:2px solid var(--accent);outline-offset:2px}
}
.letter-reveal{color:var(--accent);font-size:12px;font-weight:700;line-height:1.6}
.letter-reveal:empty,.gap-message:empty{display:none}
.gap-message{color:#b5462d;font-size:12px}
.completed-answer{display:inline;color:#315e45;border-bottom:2px solid #97b9a0;font-weight:700;padding:0 3px;margin:0 3px}
.completed-answer.is-wrong{color:#a0523c;border-bottom-color:#bf8879}
.completed-answer sup{font:700 10px system-ui,sans-serif;color:var(--accent)}
.reviewed-context.previously-correct{color:#347050;background:rgba(64,124,89,.085);border-bottom:1px solid #85ab8e;border-radius:3px;padding:0 3px;font-weight:600}
.reviewed-context.previously-correct sup{margin-left:2px;font:700 10px system-ui,sans-serif;vertical-align:super;color:#347050}
.word-count{font-size:12px;color:var(--muted);line-height:1.6;margin:24px 0 8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:43px;
  padding:10px 18px;background:var(--ink);color:#fff;border:1px solid var(--ink);
  border-radius:8px;font-size:14px;font-weight:650;
}
.btn.secondary{background:transparent;color:var(--ink)}
.btn:hover{opacity:.83}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.quiz-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.quiz-toolbar .btn{min-width:110px}
.quiz-pager{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn:disabled{opacity:.36;cursor:not-allowed}
.btn:disabled:hover{opacity:.36}
#check-summary:empty{display:none}
.feedback{background:#faf7f1;border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:18px}
.review-panel h3{font-size:16px;font-weight:700;margin:0 0 13px}
.answer-feedback{border-top:1px solid var(--line);padding:13px 0;font-size:13px;line-height:1.75}
.answer-feedback:last-child{padding-bottom:0}
.answer-feedback.correct b{color:#2f6c4b}
.answer-feedback.wrong b,.answer-feedback strong{color:var(--accent)}
.answer-feedback p{color:var(--muted);margin:4px 0 0}
.mistake{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);line-height:1.6}
.mistake:last-child{border-bottom:0}
.mistake b{font-size:15px}
.reset-one{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;color:var(--accent);font-size:12px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.number{font:normal 30px Georgia,"Times New Roman",serif;margin:0 0 8px}
.notice{border:1px solid #ecd9c4;background:#fcf4e8;border-radius:8px;padding:12px 16px;margin:14px 0;color:#80533b;font-size:13px}
#panel-stats .box h3{font-size:16px}
#panel-stats .box p{line-height:1.65}
input[type=file]{display:none}
[hidden]{display:none!important}
.guest-note{display:inline-block;margin-top:12px;padding:7px 10px;background:#efe8dc;border-radius:6px;font-size:12px;color:#795b42}
footer{border-top:1px solid var(--line);padding:23px 0;color:var(--muted);font-size:11px}

.study-notes{margin-top:18px}
.study-notes h3{margin:0 0 7px;font-size:17px}
.study-notes textarea{display:block;width:100%;padding:13px 14px;background:#fffefa;border:1px solid #d6cec0;border-radius:8px;color:var(--ink);font-size:15px;line-height:1.6;resize:vertical}
.study-notes textarea:focus{border-color:var(--accent)}
.study-notes .notes-help{margin:0 0 13px}
.expression-entry{border-top:1px solid var(--line);padding:12px 0 4px}
.expression-entry textarea{min-height:68px}
.expression-entry .reset-one{margin-top:4px}
.note-compose{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.note-compose .btn{align-self:flex-start}
@media(max-width:1020px){
 .content-layout{grid-template-columns:minmax(0,1fr)}
 .notes-sidebar{position:static;max-height:none;overflow:visible;padding:0 0 24px}
 .notes-sidebar .study-notes{margin:12px 0}
}
@media(max-width:650px){
  html{scroll-padding-top:10px}
  .wrap{width:calc(100% - 32px)}
  .top{height:56px}
  .brand{font-size:17px;letter-spacing:1.6px}
  header .nav{
    position:fixed;z-index:20;left:0;right:0;bottom:0;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
    background:rgba(253,251,247,.97);border-top:1px solid var(--line);
    box-shadow:0 -3px 15px rgba(0,0,0,.025);
  }
  .nav button{border-radius:9px;font-size:13px;min-height:44px;padding:8px 4px}
  .hero{padding:16px 0 15px}
  .hero .eyebrow{display:none}
  .hero h1{font-size:30px;line-height:1.14;margin:0 0 5px}
  .hero .sub{font-size:12px}
  .meta{display:none}
  .panel{padding:16px 0 calc(90px + env(safe-area-inset-bottom))}
  .head{margin:0 0 13px}
  .head h2{font-size:17px;margin:4px 0}
  .box{border-radius:10px;padding:19px 15px;margin:0}
  .snippet-title{font-size:23px;margin:15px 0 17px}
  .passage-text{font-size:19px;line-height:2.0;letter-spacing:0}
  .answer-group{gap:4px;margin:6px 1px 6px 2px}
  .single-word-slot{width:105px;max-width:38vw;min-height:43px;font-size:16px}
  .gap-action{min-height:42px;min-width:45px;padding:5px 7px;font-size:12px}
  .letter-reveal,.gap-message,.hint-limit-message{flex-basis:100%;padding-left:12px}
  .word-count{margin:22px 0 4px}
  .btn{min-height:44px}
  .actions .btn{width:100%}
  .quiz-toolbar{display:grid;grid-template-columns:1fr;gap:10px}
  .quiz-toolbar>.btn{width:100%;min-width:0}
  .quiz-pager{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
  .quiz-pager .btn{width:100%;min-width:0}
  .feedback{padding:14px 13px}
  .review-panel h3{font-size:14px}
  .mistake{gap:10px}
  .mistake>.muted{text-align:right}
  .grid{gap:9px}
  .grid>.box{padding:14px}
  .number{font-size:25px}
  footer{display:none}
}
@media(max-width:340px){
  .single-word-slot{width:94px}
  .gap-action{min-width:40px;padding-inline:6px}
  .passage-text{font-size:18px}
}

   <button class="active" data-tab="quiz">填空 <span id="due-count"></span></button>
   <button data-tab="mistakes">错题</button>
   <button data-tab="stats">记录</button>
  </nav>
 </div>
</header>
<main class="wrap">
 <section class="hero">
  <h1>The World in Brief.</h1>
  <p class="sub">读新闻，练表达，记住真正会写的英语。</p>
  <div class="meta" id="today"></div>
  <div id="guest-note" class="guest-note" hidden></div>
 </section>
 <div id="notice" class="notice" hidden></div>
 <div class="content-layout">
 <div class="primary-content">
 <section class="panel" id="panel-quiz" hidden>
  <div class="head"><h2>今日填空</h2><div class="muted" id="edition-label"></div></div>
  <div id="quiz"></div>
 </section>
 <section class="panel" id="panel-mistakes" hidden>
  <div class="head"><h2>错题本</h2></div>
  <div id="mistakes"></div>
 </section>
 <section class="panel" id="panel-stats" hidden>
  <div class="head"><h2>学习记录</h2></div>
  <div id="stats"></div>
  <div class="box" id="cloud-backup">
   <h3>学习记录同步</h3>
   <p class="muted" id="cloud-status">检查云同步状态中…</p>
   <div id="cloud-controls" class="actions" hidden>
    <button type="button" class="btn" id="cloud-create">建立云端备份</button>
    <button type="button" class="btn secondary" id="cloud-copy" hidden>复制恢复密钥</button>
    <button type="button" class="btn secondary" id="cloud-now" hidden>立即同步</button>
    <button type="button" class="btn secondary" id="cloud-share-mistakes" hidden>复制 ChatGPT 错题只读链接</button>
    <button type="button" class="btn secondary" id="cloud-switch" hidden>其他设备恢复</button>
   </div>
   <p class="muted">完整学习记录加密保存，答错的题目单独汇总供复习。不同设备使用同一恢复密钥即可同步；错题只读链接仅供你授权的 ChatGPT 使用，请勿公开分享。</p>
  </div>
  <div class="box" id="backup-tools">
   <h3>备份学习记录</h3>
   <p class="muted">本机自动保存，换设备时可以导出、导入。</p>
   <div class="actions">
    <button class="btn" id="copy-mistakes">复制今日错题</button>
    <button class="btn" id="export">导出</button>
    <label class="btn secondary" for="import">导入</label>
    <input type="file" accept=".json,application/json" id="import">
   </div>
   <p class="muted" id="copy-mistakes-status" role="status" aria-live="polite"></p>
  </div>
 </section>
 </div>
 <aside class="notes-sidebar" id="notes-sidebar" aria-label="个人英语笔记">
  <section class="box study-notes" id="daily-draft-box" aria-label="每日随笔草稿">
   <h3>随笔草稿</h3>
   <p class="muted notes-help" id="draft-day"></p>
   <textarea id="daily-draft" rows="5" placeholder="随手记下想到的关联表达，例如：compromise on sth · deliver on a promise"></textarea>
   <p class="muted" id="draft-save-status" role="status">自动保存到个人学习记录，次日显示新空白草稿；历史草稿保留在云端备份中。</p>
  </section>
  <section class="box study-notes" id="expression-notebook" aria-label="长期表达笔记">
   <h3>表达积累</h3>
   <p class="muted notes-help">输入即自动保存。每天显示全部内容，可随时编辑。</p>
   <div class="note-compose">
    <textarea id="expression-new" rows="7" placeholder="在此持续积累表达，每行记录一条。例如：&#10;deliver on a promise = 兑现承诺"></textarea>
    <p id="expression-save-status" class="muted" role="status">自动保存</p>
   </div>
   <div id="expression-list"></div>
  </section>
 </aside>
 </div>
</main>

<script src="./app.js?v=20261115-hint-shake"></script>
<script src="./cloud-config.js?v=1"></script>
<script src="./cloud-sync.js?v=20261115-due-filter"></script>
</body>
</html>
