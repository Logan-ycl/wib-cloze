<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1">
<meta name="description" content="BriefLab 每日英语新闻挖空练习，主动回忆地道表达，错题间隔复习。">
<meta name="apple-mobile-web-app-title" content="BriefLab">
<title>BriefLab · 每日英文填空</title>
<style>
:root{
  color-scheme:light;
  --page:#f8f6f1;--surface:#fffefa;--ink:#292c26;--muted:#6c716b;
  --line:#e5e1d7;--accent:#9d543a;--accent-soft:#f5eae3;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-synthesis:none;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);min-width:280px}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(100% - 48px,880px);margin-inline:auto}
header{background:var(--page);border-bottom:1px solid var(--line)}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:19px;font-weight:800;letter-spacing:1.8px;white-space:nowrap}
.brand b{color:var(--accent)}
.nav{display:flex;align-items:center;gap:5px}
.nav button{
  background:transparent;border:0;border-radius:9px;color:var(--muted);
  padding:11px 15px;font-size:14px;font-weight:550;min-height:42px;
}
.nav button.active{color:var(--ink);background:#eae6dc;font-weight:700}
.nav button:hover{background:#eeebe3}
.hero{padding:28px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.9px;text-transform:uppercase;color:var(--accent)}
.hero h1{font:normal clamp(32px,5vw,47px)/1.12 Georgia,"Times New Roman",serif;letter-spacing:-.8px;margin:11px 0 8px}
.hero .sub{font-size:14px;color:var(--muted);margin:0}
.meta{font-size:11px;color:#87877d;margin-top:12px}
.panel{padding:22px 0 48px}
.panel[hidden],.notice[hidden]{display:none}
.head{margin:0 0 16px}
.head h2{font-size:19px;font-weight:700;margin:6px 0}
.head .eyebrow{display:none}
.muted{color:var(--muted);font-size:12px;line-height:1.6}
.box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:27px;margin:12px 0;
}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.snippet-title{font:normal clamp(23px,3vw,29px)/1.24 Georgia,"Times New Roman",serif;margin:16px 0 21px;color:var(--ink)}
.passage-wrap{max-width:100%}
.passage-text{font:normal clamp(19px,2.4vw,22px)/2.0 Georgia,"Times New Roman",serif;letter-spacing:.05px;margin:0 0 18px;overflow-wrap:break-word}
.answer-group{
  display:inline-flex;align-items:center;flex-wrap:wrap;vertical-align:middle;
  gap:5px;max-width:100%;margin:5px 3px;
}
.blank-tag{font:700 11px/1.3 system-ui,sans-serif;color:var(--accent);align-self:flex-start}
.single-word-slot{
  width:118px;max-width:40vw;min-height:40px;line-height:1.2;
  border:1px solid #d6cec0;border-bottom:2px solid var(--accent);
  border-radius:6px 6px 2px 2px;background:#f8f5ef;
  color:var(--ink);text-align:center;padding:6px 8px;
  font:normal 17px Georgia,"Times New Roman",serif;
}
.single-word-slot:focus{background:white;border-color:var(--accent)}
.gap-action{
  border:1px solid var(--line);border-radius:7px;
  background:transparent;color:#66665e;min-height:38px;min-width:44px;
  padding:5px 9px;font-size:12px;font-weight:650;line-height:1.15;
}
.gap-check{background:var(--ink);color:#fff;border-color:var(--ink)}
.gap-action:hover{opacity:.82}
.letter-reveal{color:var(--accent);font-size:12px;font-weight:700;line-height:1.6}
.letter-reveal:empty,.gap-message:empty{display:none}
.gap-message{color:#b5462d;font-size:12px}
.completed-answer{display:inline;color:#315e45;border-bottom:2px solid #97b9a0;font-weight:700;padding:0 3px;margin:0 3px}
.completed-answer.is-wrong{color:#a0523c;border-bottom-color:#bf8879}
.completed-answer sup{font:700 10px system-ui,sans-serif;color:var(--accent)}
.word-count{font-size:12px;color:var(--muted);line-height:1.6;margin:24px 0 8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:43px;
  padding:10px 18px;background:var(--ink);color:#fff;border:1px solid var(--ink);
  border-radius:8px;font-size:14px;font-weight:650;
}
.btn.secondary{background:transparent;color:var(--ink)}
.btn:hover{opacity:.83}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.feedback{background:#faf7f1;border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:18px}
.review-panel h3{font-size:16px;font-weight:700;margin:0 0 13px}
.answer-feedback{border-top:1px solid var(--line);padding:13px 0;font-size:13px;line-height:1.75}
.answer-feedback:last-child{padding-bottom:0}
.answer-feedback.correct b{color:#2f6c4b}
.answer-feedback.wrong b,.answer-feedback strong{color:var(--accent)}
.answer-feedback p{color:var(--muted);margin:4px 0 0}
.mistake{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);line-height:1.6}
.mistake:last-child{border-bottom:0}
.mistake b{font-size:15px}
.reset-one{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;color:var(--accent);font-size:12px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.number{font:normal 30px Georgia,"Times New Roman",serif;margin:0 0 8px}
.notice{border:1px solid #ecd9c4;background:#fcf4e8;border-radius:8px;padding:12px 16px;margin:14px 0;color:#80533b;font-size:13px}
#panel-stats .box h3{font-size:16px}
#panel-stats .box p{line-height:1.65}
input[type=file]{display:none}
[hidden]{display:none!important}
.guest-note{display:inline-block;margin-top:12px;padding:7px 10px;background:#efe8dc;border-radius:6px;font-size:12px;color:#795b42}
footer{border-top:1px solid var(--line);padding:23px 0;color:var(--muted);font-size:11px}
@media(max-width:650px){
  html{scroll-padding-top:10px}
  .wrap{width:calc(100% - 32px)}
  .top{height:56px}
  .brand{font-size:17px;letter-spacing:1.6px}
  header .nav{
    position:fixed;z-index:20;left:0;right:0;bottom:0;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;
    background:rgba(253,251,247,.97);border-top:1px solid var(--line);
    box-shadow:0 -3px 15px rgba(0,0,0,.025);
  }
  .nav button{border-radius:9px;font-size:13px;min-height:44px;padding:8px 4px}
  .hero{padding:16px 0 15px}
  .hero .eyebrow{display:none}
  .hero h1{font-size:30px;line-height:1.14;margin:0 0 5px}
  .hero .sub{font-size:12px}
  .meta{display:none}
  .panel{padding:16px 0 calc(90px + env(safe-area-inset-bottom))}
  .head{margin:0 0 13px}
  .head h2{font-size:17px;margin:4px 0}
  .box{border-radius:10px;padding:19px 15px;margin:0}
  .snippet-title{font-size:23px;margin:15px 0 17px}
  .passage-text{font-size:19px;line-height:2.0;letter-spacing:0}
  .answer-group{gap:4px;margin:6px 1px 6px 2px}
  .single-word-slot{width:105px;max-width:38vw;min-height:43px;font-size:16px}
  .gap-action{min-height:42px;min-width:45px;padding:5px 7px;font-size:12px}
  .letter-reveal,.gap-message{flex-basis:100%;padding-left:12px}
  .word-count{margin:22px 0 4px}
  .btn{min-height:44px}
  .actions .btn{width:100%}
  .feedback{padding:14px 13px}
  .review-panel h3{font-size:14px}
  .mistake{gap:10px}
  .mistake>.muted{text-align:right}
  .grid{gap:9px}
  .grid>.box{padding:14px}
  .number{font-size:25px}
  footer{display:none}
}
@media(max-width:340px){
  .single-word-slot{width:94px}
  .gap-action{min-width:40px;padding-inline:6px}
  .passage-text{font-size:18px}
}
</style>
</head>
<body>
<header>
 <div class="wrap top">
  <div class="brand">BRIEF<b>LAB.</b></div>
  <nav class="nav" aria-label="主要导航">
   <button class="active" data-tab="quiz">填空 <span id="due-count"></span></button>
   <button data-tab="mistakes">错题</button>
   <button data-tab="stats">记录</button>
  </nav>
 </div>
</header>
<main class="wrap">
 <section class="hero">
  <h1>The World in Brief.</h1>
  <p class="sub">读新闻，练表达，记住真正会写的英语。</p>
  <div class="meta" id="today"></div>
  <div id="guest-note" class="guest-note" hidden></div>
 </section>
 <div id="notice" class="notice" hidden></div>
 <section class="panel" id="panel-quiz" hidden>
  <div class="head"><h2>今日填空</h2><div class="muted" id="edition-label"></div></div>
  <div id="quiz"></div>
 </section>
 <section class="panel" id="panel-mistakes" hidden>
  <div class="head"><h2>错题本</h2></div>
  <div id="mistakes"></div>
 </section>
 <section class="panel" id="panel-stats" hidden>
  <div class="head"><h2>学习记录</h2></div>
  <div id="stats"></div>
  <div class="box" id="backup-tools">
   <h3>备份学习记录</h3>
   <p class="muted">本机自动保存，换设备时可以导出、导入。</p>
   <div class="actions">
    <button class="btn" id="export">导出</button>
    <label class="btn secondary" for="import">导入</label>
    <input type="file" accept=".json,application/json" id="import">
   </div>
  </div>
 </section>
</main>
<footer><div class="wrap">BriefLab · Daily English Practice</div></footer>
<script src="./app.js?v=20261112-guest"></script>
</body>
</html>
