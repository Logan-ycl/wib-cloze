name: Manual Fallback - Public Podcast Preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate notes from public preview
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python scripts/update_daily.py
      - name: Validate lesson format
        run: python scripts/update_daily.py --validate-only
      - name: Commit updated lesson and question bank
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/latest.json content/catalog.json
            git commit -m "Update BriefLab daily language notes"
            git push
          fi
