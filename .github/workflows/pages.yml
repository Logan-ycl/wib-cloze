name: Publish BriefLab Website
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - cloud-sync.js
      - cloud-config.js
      - scripts/validate_cloze.py
      - content/catalog.json
      - manifest.webmanifest
      - favicon.svg
      - icons/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-word cloze rules
        run: python3 scripts/validate_cloze.py
      - name: Prepare static website
        run: |
          mkdir -p _site/content _site/icons
          cp index.html app.js cloud-sync.js cloud-config.js manifest.webmanifest favicon.svg _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          cp -R content/. _site/content/
          touch _site/.nojekyll
      - name: Verify installable app assets in publish bundle
        run: |
          python3 -m json.tool _site/manifest.webmanifest >/dev/null
          test -s _site/favicon.svg
          test -s _site/icons/icon-192.png
          test -s _site/icons/icon-512.png
          grep -q 'rel="manifest"' _site/index.html
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live PWA icon and manifest URLs
        run: |
          SITE="${{ steps.deployment.outputs.page_url }}"
          echo "Checking deployed site: $SITE"
          for path in manifest.webmanifest favicon.svg icons/icon-192.png icons/icon-512.png; do
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "${SITE%/}/$path" --output /dev/null
            echo "OK: $path"
          done
