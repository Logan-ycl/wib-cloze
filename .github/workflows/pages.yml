name: Publish BriefLab Website
# Publish the complete site bundle after content updates; retain artifact for deploy.
# Fresh publication run after GitHub Pages artifact API race on 2026-11-19.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - cloud-sync.js
      - cloud-config.js
      - scripts/validate_cloze.py
      - scripts/test_spaced_review.cjs
      - scripts/test_cloud_sync.cjs
      - scripts/verify_live_release.py
      - content/catalog.json
      - manifest.webmanifest
      - manifest.mine.webmanifest
      - favicon.svg
      - icons/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-word cloze rules
        run: python3 scripts/validate_cloze.py
      - name: Verify spaced repetition and saved-answer invariants
        run: node scripts/test_spaced_review.cjs
      - name: Verify phone and desktop cloud merge
        run: node scripts/test_cloud_sync.cjs
      - name: Prepare static website
        run: |
          mkdir -p _site/content _site/icons
          cp index.html app.js cloud-sync.js cloud-config.js manifest.webmanifest manifest.mine.webmanifest favicon.svg _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          cp -R content/. _site/content/
          touch _site/.nojekyll
      - name: Verify installable app assets in publish bundle
        run: |
          python3 -m json.tool _site/manifest.webmanifest >/dev/null
          python3 -m json.tool _site/manifest.mine.webmanifest >/dev/null
          grep -q '\"start_url\": \"./#mine\"' _site/manifest.mine.webmanifest
          test -s _site/favicon.svg
          test -s _site/icons/icon-192.png
          test -s _site/icons/icon-512.png
          grep -q 'rel="manifest"' _site/index.html
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live PWA icon and manifest URLs
        run: |
          SITE="${{ steps.deployment.outputs.page_url }}"
          echo "Checking deployed site: $SITE"
          for path in manifest.webmanifest manifest.mine.webmanifest favicon.svg icons/icon-192.png icons/icon-512.png; do
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "${SITE%/}/$path" --output /dev/null
            echo "OK: $path"
          done
          curl --fail --silent --show-error --location "$SITE" --output /tmp/brieflab-home.html
          grep -q 'manifest.mine.webmanifest' /tmp/brieflab-home.html
      - name: Verify deployed learning edition and catalog match GitHub
        run: python3 scripts/verify_live_release.py "${{ steps.deployment.outputs.page_url }}"
