name: Build BriefLab install icons
on:
  push:
    paths:
      - '.github/workflows/build-app-icons.yml'
      - 'favicon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate PNG icons
        run: |
          python -m pip install --quiet cairosvg
          mkdir -p icons
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='favicon.svg',write_to=f'icons/icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate installable PNG lighthouse icons"
            git push
          fi
