name: Deploy BriefLab Cloud Sync
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision D1, deploy Worker and verify encrypted API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloud/deploy-ci.mjs
      - name: Persist verified public endpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-config.js
          if ! git diff --cached --quiet; then
            git commit -m 'Connect BriefLab to verified cloud sync endpoint'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare website
        run: |
          python3 scripts/validate_cloze.py
          mkdir -p _site/content
          cp index.html app.js cloud-config.js cloud-sync.js _site/
          cp -R content/. _site/content/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: pages
